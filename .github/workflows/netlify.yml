name: Deploy to Netlify from GitLab - Hugo blog 

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # Required for deploy-pages action

    env:
      DART_SASS_VERSION: 1.97.3
      HUGO_VERSION: 0.155.3
      NODE_VERSION: 20

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    # 0. CRITICAL: EARLY SYSTEM CLEANUP
    - name: Aggressive Runner System Cleanup
      run: |
        echo "Starting aggressive system cleanup..."
        sudo apt-get autoremove -y
        sudo apt-get clean
        if command -v docker &> /dev/null; then
          sudo docker system prune --all --force
        fi
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        df -h

    # 1. Checkout Code from GitLab (Updated with depth 1)
    - name: Checkout Code with Submodule Authentication
      env:
        GIT_OAUTH_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      run: |
        git config --global url."https://oauth2:$GIT_OAUTH_TOKEN@gitlab.com".insteadOf "https://gitlab.com"
        git clone --depth 1 https://gitlab.com/tejasjog/blog.git
        cd blog

    # 2. Run Submodule Update and Cleanup .git files (Updated with depth 1)
    - name: Update Submodules and Cleanup Content Directories
      working-directory: blog
      run: |
        echo "Attempting to update submodules..."
        git submodule update --init --force --recursive --remote --verbose --depth 1
        echo "Total files in repository (excluding .git):"
        find . -path ./.git -prune -o -type f -print | wc -l

    # 3. Optimized Node.js Setup
    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # 4. Install Brotli, Dart Sass, and Hugo
    - name: Install Dependencies with Cleanup
      run: |
        sudo apt-get update
        sudo apt-get install -y brotli
        DART_SASS_FILENAME="dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz"
        curl -LJO https://github.com/sass/dart-sass/releases/download/${{ env.DART_SASS_VERSION }}/$DART_SASS_FILENAME
        tar -xf $DART_SASS_FILENAME
        sudo cp -r dart-sass/* /usr/local/bin/
        rm -rf dart-sass*
        HUGO_DEB_FILENAME="hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb"
        sudo curl -LJO https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/$HUGO_DEB_FILENAME
        sudo apt-get install -y ./$HUGO_DEB_FILENAME
        sudo rm $HUGO_DEB_FILENAME
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h

    # 5. Install Node Dependencies and Global CLIs
    - name: Install Node Dependencies and Global CLIs
      working-directory: blog
      run: |
        npm install
        npm install -g netlify-cli

    # 6. Modify responsiveImage Shortcode for Netlify Widths
    - name: Modify responsiveImage Shortcode for Netlify Widths
      working-directory: blog
      run: |
        SHORTCODE_PATH=$(find . -path "*/shortcodes/responsiveImage.html" -type f | head -n 1)
        OLD_TEXT='slice 1600'
        NEW_TEXT='${{ vars.NETLIFY_IMAGE_WIDTHS }}'
        if [ -n "$SHORTCODE_PATH" ]; then
          sed -i "s|${OLD_TEXT}|${NEW_TEXT}|g" "$SHORTCODE_PATH"
          echo "Updated shortcode with: $NEW_TEXT"
        else
          echo "Warning: responsiveImage.html not found."
        fi

    # 7. Build Hugo Site
    - name: Build Hugo Site (for Netlify)
      working-directory: blog
      run: |
        hugo --gc --minify --baseURL ${{ vars.CI_CF_PAGES_URL || 'https://tejasjog-blog.netlify.app/' }} --destination public --environment production
        du -sh public

    # 8. Cleanup .droplist Files (Logic synchronized from main.yml)
    - name: Cleanup .droplist Files and Report Size
      working-directory: blog
      run: |
        echo "Searching for .droplist files..."
        DROPLIST_FILES=$(find . -name "*.droplist")
        if [ -z "$DROPLIST_FILES" ]; then
          echo "No .droplist files found."
        else
          for DROPLIST_FILE in $DROPLIST_FILES; do
            DROPLIST_DIR=$(dirname "$DROPLIST_FILE")
            while IFS= read -r FILE_TO_DELETE || [ -n "$FILE_TO_DELETE" ]; do
              if [ -z "$FILE_TO_DELETE" ]; then continue; fi
              filename="${FILE_TO_DELETE%.*}"
              extension="${FILE_TO_DELETE##*.}"
              if [ "$filename" != "$FILE_TO_DELETE" ]; then
                UPPERCASE_EXTENSION="${extension^^}"
                LOWERCASE_EXTENSION=$(echo "$extension" | tr '[:upper:]' '[:lower:]')
                for path in "$DROPLIST_DIR/${filename}.${LOWERCASE_EXTENSION}" "$DROPLIST_DIR/${filename}.${UPPERCASE_EXTENSION}"; do
                  if [ -f "$path" ]; then
                    rm "$path" && echo "Deleted: $path"
                  fi
                done
              else
                if [ -f "$DROPLIST_DIR/$FILE_TO_DELETE" ]; then
                  rm "$DROPLIST_DIR/$FILE_TO_DELETE" && echo "Deleted: $FILE_TO_DELETE"
                fi
              fi
            done < "$DROPLIST_FILE"
          done
        fi

    # 9. Netlify Deployment Phase & Size Reporting
    - name: Echo public folder size
      run: |
        echo "Calculating the size of the public folder..."
        du -sh blog/public

    - name: Netlify Deployment Phase and Cleanup
      working-directory: blog
      run: |
        echo "Starting Netlify deployment..."
        netlify deploy --prod --dir public --site ${{ secrets.NETLIFY_SITE_ID }}
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}        

    # 10. CRITICAL SPACE CLEANUP
    - name: Cleanup Netlify Build Assets
      working-directory: blog
      run: |
        rm -rf public
        df -h
