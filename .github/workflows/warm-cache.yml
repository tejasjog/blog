
name: "Post-Deploy Cache Warmer"

on:
  workflow_run:
    workflows: ["Deploy"] # MUST match the 'name:' field in your main deployment yml
    types:
      - completed

jobs:
  warm:
    runs-on: ubuntu-latest
    # Only run if the deployment actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install xml2js jsdom

      - name: Execute Warmer
        run: node warm-cache.mjs
