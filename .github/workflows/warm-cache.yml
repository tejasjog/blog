name: "Post-Deploy Cache Warmer"

on:
  # 1. Triggered when the Cloudflare deployment workflow finishes
  workflow_run:
    workflows: ["Deploy to Cloudflare Pages from GitLab - Hugo blog"] # Ensure this matches the 'name:' at the top of your cloudflare.yml
    types:
      - completed
  
  # 2. Allows you to run this manually from the "Actions" tab in GitHub
  workflow_dispatch:

# Prevents multiple warming jobs from overlapping
concurrency:
  group: cache-warming
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    # Run if manual OR if the previous workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install xml2js jsdom

      - name: Execute Warmer
        run: node warm-cache.mjs
