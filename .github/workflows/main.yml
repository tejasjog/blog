name: Deploy Single File from GitLab to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Clone the GitLab repository
      - name: Clone GitLab Repository
        env:
          GL_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        run: |
          git clone --depth 1 "https://oauth2:${GL_TOKEN}@gitlab.com/tejasjog/blog.git" gitlab-content

      # 2. Prepare the deployment folder using the path verified by logs
      - name: Prepare Files
        run: |
          mkdir -p staging
          
          # Based on your logs, the file is at: gitlab-content/gitlab.io/index.html
          TARGET="gitlab-content/github.io/index.html"
          
          if [ -f "$TARGET" ]; then
            cp "$TARGET" staging/index.html
            echo "Successfully found and copied index.html"
          else
            echo "ERROR: File $TARGET not found!"
            exit 1
          fi

      # 3. Upload the 'staging' folder as the website content
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging'

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
