name: Deploy Single File from GitLab to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Manually clone from GitLab (actions/checkout only supports GitHub)
      - name: Clone GitLab Repository
        env:
          GL_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        run: |
          # We clone into a folder named 'gitlab-content' to keep things organized
          git clone --depth 1 "https://oauth2:${GL_TOKEN}@gitlab.com/tejasjog/blog.git" gitlab-content

      # 2. Prepare the deployment folder
      - name: Prepare Files
        run: |
          mkdir -p staging
          
          # Look for the file inside the cloned directory
          # Checking both potential paths based on your previous logs
          if [ -f "gitlab-content/blog/github.io/index.html" ]; then
            cp gitlab-content/blog/github.io/index.html staging/index.html
            echo "Found file in gitlab-content/blog/github.io/"
          elif [ -f "gitlab-content/github.io/index.html" ]; then
            cp gitlab-content/github.io/index.html staging/index.html
            echo "Found file in gitlab-content/github.io/"
          else
            echo "ERROR: index.html not found!"
            echo "Showing directory structure for debugging:"
            ls -R gitlab-content
            exit 1
          fi

      # 3. Upload the 'staging' folder as the website content
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging'

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
