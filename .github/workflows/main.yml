name: Deploy to GitHub Pages from GitLab - Hugo blog 

on:
  workflow_dispatch:

jobs:
  deploy:
    # IMPORTANT: Consider using 'ubuntu-20.04' instead of 'ubuntu-latest'
    # if 'ubuntu-latest' (currently 24.04) has less disk space on your self-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write # Required for deploy-pages action

    env:
      DART_SASS_VERSION: 1.97.3
      HUGO_VERSION: 0.155.3
      NODE_VERSION: 20

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # This removes large pre-installed tools to free up ~30GB+
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    # 0. CRITICAL: EARLY SYSTEM CLEANUP
    # This step is designed to aggressively free up space before any installation or cloning.
    - name: Aggressive Runner System Cleanup
      run: |
        echo "Starting aggressive system cleanup..."
        # 1. Clean apt package cache
        sudo apt-get autoremove -y
        sudo apt-get clean

        # 2. Remove common large tools/caches not needed for this workflow (e.g., Azure, Docker images)
        # Check if these directories exist before trying to remove them.
        echo "Removing large tool caches and unnecessary packages..."

        # Docker images can be huge; removing them is often the biggest win
        if command -v docker &> /dev/null; then
          sudo docker system prune --all --force
        fi

        # Remove large .NET and Android SDK packages
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc

        # Print disk usage after initial cleanup
        echo "Disk usage after aggressive cleanup:"
        df -h

    # 1. Checkout Code from GitLab
    - name: Checkout Code with Submodule Authentication
      env:
        GIT_OAUTH_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      run: |
        git config --global url."https://oauth2:$GIT_OAUTH_TOKEN@gitlab.com".insteadOf "https://gitlab.com"
        git clone --depth 1 https://gitlab.com/tejasjog/blog.git
        cd blog

    # 2. Run Submodule Update and Cleanup .git files
    - name: Update Submodules and Cleanup Content Directories
      working-directory: blog
      run: |
        echo "Attempting to update submodules..."
        git submodule update --init --force --recursive --remote --verbose --depth 1

        echo "Total files in repository (excluding .git):"
        find . -path ./.git -prune -o -type f -print | wc -l

    # 3. Optimized Node.js Setup
    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # 4. Install Brotli, Dart Sass, and Hugo (Manual install with immediate cleanup)
    - name: Install Dependencies with Cleanup
      run: |
        echo "Installing system dependencies: brotli, Dart Sass, and Hugo..."
        sudo apt-get update
        sudo apt-get install -y brotli

        # Install Dart Sass
        DART_SASS_FILENAME="dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz"
        curl -LJO https://github.com/sass/dart-sass/releases/download/${{ env.DART_SASS_VERSION }}/$DART_SASS_FILENAME
        tar -xf $DART_SASS_FILENAME
        sudo cp -r dart-sass/* /usr/local/bin/
        rm -rf dart-sass* # CRITICAL CLEANUP 1

        # Install Hugo
        HUGO_DEB_FILENAME="hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.deb"
        sudo curl -LJO https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/$HUGO_DEB_FILENAME
        sudo apt-get install -y ./$HUGO_DEB_FILENAME
        sudo rm $HUGO_DEB_FILENAME # CRITICAL CLEANUP 2

        # FINAL PACKAGE CLEANUP
        sudo apt-get autoremove -y
        sudo apt-get clean
        echo "Dependencies installed. Disk usage check before npm install:"
        df -h

    # 5. Install Node Dependencies and Global CLIs
    - name: Install Node Dependencies and Global CLIs
      working-directory: blog
      run: |
        npm install
        # Install CLIs here. Since Node is set up, this should work.
        npm install -g wrangler

    # 6.1. Modify for GitHub Pages Widths and Format
    - name: Modify responsiveImage Shortcode for GitHub Pages Widths and Format
      working-directory: blog
      run: |
        SHORTCODE_PATH=$(find . -path "*/shortcodes/responsiveImage.html" -type f | head -n 1)
        OLD_WIDTH='slice 1600'
        NEW_WIDTH='slice 800'
        OLD_FORMAT='avif'
        NEW_FORMAT='webp'

        if [ -n "$SHORTCODE_PATH" ]; then
          echo "Found shortcode at: $SHORTCODE_PATH"

          echo "--- Snippets BEFORE replacement (GitHub Pages) ---"
          # Show both the width slice and the format options line
          grep -E "$OLD_WIDTH|$OLD_FORMAT" "$SHORTCODE_PATH" || echo "Target text not found."

          # Perform replacements
          sed -i "s|${OLD_WIDTH}|${NEW_WIDTH}|g" "$SHORTCODE_PATH"
          sed -i "s|${OLD_FORMAT}|${NEW_FORMAT}|g" "$SHORTCODE_PATH"
          
          echo "--- Snippets AFTER replacement (GitHub Pages) ---"
          # Show the updated lines
          grep -E "$NEW_WIDTH|$NEW_FORMAT" "$SHORTCODE_PATH"
        else
          echo "Warning: responsiveImage.html not found."
        fi
        
    - name: Batch Update Image Widths and Format to GitHub Pages Settings
      working-directory: blog
      run: |
        # Define the target variables
        NEW_WIDTH='800'
        OLD_WIDTH='1600'
        NEW_FORMAT='webp'
        OLD_FORMAT='avif'
        
        echo "Target GitHub Pages Settings: Width=$NEW_WIDTH, Format=$NEW_FORMAT"

        # Define the list of files to process
        FILES_TO_EDIT=(
          "$(find . -path "*/_default/_markup/render-image.html" -type f -not -path "./themes/*" | head -n 1)"
          "$(find . -path "*/layouts/shortcodes/img.html" -type f | head -n 1)"
          "$(find . -path "*/layouts/partials/cover_image.html" -type f | head -n 1)"
        )

        for FILE_PATH in "${FILES_TO_EDIT[@]}"; do
          if [ -f "$FILE_PATH" ]; then
            echo "========================================================"
            echo "Processing: $FILE_PATH"
            
            echo "--- Snippets BEFORE replacement ---"
            grep -E "$OLD_WIDTH|$OLD_FORMAT" "$FILE_PATH" || echo "Note: Target values not found."

            # Perform the replacements for width and format
            sed -i "s|${OLD_WIDTH}|${NEW_WIDTH}|g" "$FILE_PATH"
            sed -i "s|${OLD_FORMAT}|${NEW_FORMAT}|g" "$FILE_PATH"
            
            echo "--- Snippets AFTER replacement ---"
            grep -E "$NEW_WIDTH|$NEW_FORMAT" "$FILE_PATH"
          else
            echo "Warning: File not found: $FILE_PATH"
          fi
        done

    # 6.2. Modify for Yandex Verification Tag for GitHub Pages
    - name: Update Yandex Verification Tag for GitHub Pages
      working-directory: blog
      run: |
        echo "--- Verification tag BEFORE replacement ---"
        grep "SiteVerificationTag: yandex-SiteVerificationTag" hugo.yaml || echo "Tag not found!"

        echo "Updating Yandex SiteVerificationTag for GitHub Pages..."
        sed -i "s/SiteVerificationTag: yandex-SiteVerificationTag/SiteVerificationTag: ${{ vars.PAGES_GITHUB_YANDEX_SITEVERIFICATIONTAG }}/g" hugo.yaml
        
        echo "--- Verification tag AFTER replacement ---"
        grep "SiteVerificationTag" hugo.yaml
        
    # 7. Build Hugo Site (First Build - Where it was failing)
    - name: Build Hugo Site (for GitHub Pages)
      working-directory: blog
      run: |
        echo "Running Hugo build. Final disk check before build:"
        df -h
        hugo --gc --minify --baseURL ${{ vars.CI_CF_PAGES_URL || 'https://tejasjog.github.io/blog/' }} --destination public --environment production
        echo "Hugo build complete. Disk usage after build:"
        du -sh public
        df -h
  
    # 8. Cleanup .droplist Files (Source & Public) - Recursive Path Fix
    - name: Cleanup .droplist Files and Report Deletions
      working-directory: blog
      run: |
        echo "========================================================"
        echo "SEARCHING FOR .DROPLIST FILES"
        echo "========================================================"
        DROPLIST_FILES=$(find . -name "*.droplist")
        
        if [ -z "$DROPLIST_FILES" ]; then
          echo "No .droplist files found."
        else
          for DROPLIST_FILE in $DROPLIST_FILES; do
            echo "--------------------------------------------------------"
            echo "Processing droplist: $DROPLIST_FILE"
            
            # 1. Get the directory containing the droplist
            # Example: ./content/posts/2025/09/19
            # Example: ./public/posts/2025/09/19
            BASE_DIR=$(dirname "$DROPLIST_FILE")
            
            while IFS= read -r ENTRY || [ -n "$ENTRY" ]; do
              if [ -z "$ENTRY" ]; then continue; fi
              
              # 2. Handle entries that might have subfolders (e.g., images/photo.jpg)
              # Split into folder and filename
              FILE_NAME=$(basename "$ENTRY")
              SUB_DIR=$(dirname "$ENTRY")
              if [ "$SUB_DIR" = "." ]; then SUB_DIR=""; else SUB_DIR="/$SUB_DIR"; fi

              # 3. Calculate Case Variations for the filename
              base="${FILE_NAME%.*}"
              ext="${FILE_NAME##*.}"
              base_l=$(echo "$base" | tr '[:upper:]' '[:lower:]')
              base_u=$(echo "$base" | tr '[:lower:]' '[:upper:]')
              ext_l=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
              ext_u=$(echo "$ext" | tr '[:lower:]' '[:upper:]')

              VAR_NAMES=(
                "$FILE_NAME"
                "${base_l}.${ext_l}"
                "${base_u}.${ext_u}"
                "${base_u}.${ext_l}"
                "${base_l}.${ext_u}"
              )

              DELETED_ANY=false
              for name in $(printf "%s\n" "${VAR_NAMES[@]}" | sort -u); do
                # Construct the path using the directory where the droplist was found
                # This works regardless of whether the droplist is in 'content' or 'public'
                TARGET_PATH="${BASE_DIR}${SUB_DIR}/${name}"
                
                if [ -f "$TARGET_PATH" ]; then
                  rm "$TARGET_PATH"
                  echo "[DELETED] $TARGET_PATH"
                  DELETED_ANY=true
                fi
              done

              if [ "$DELETED_ANY" = false ]; then
                echo "[NOT FOUND] $ENTRY (checked all variants in ${BASE_DIR}${SUB_DIR})"
              fi
            done < "$DROPLIST_FILE"
            
            rm "$DROPLIST_FILE"
          done
        fi

    # 8.5. Detailed Size Analysis
    - name: Deep Analysis of Public Folder Size
      working-directory: blog
      run: |
        echo "========================================================"
        echo "1. TOTAL DEPLOYMENT SIZE"
        echo "========================================================"
        du -sh public
        
        echo ""
        echo "========================================================"
        echo "2. HIERARCHICAL FOLDER BREAKDOWN (4 levels deep)"
        echo "========================================================"
        # This shows the size of subfolders like public/posts, public/images, etc.
        du -h --max-depth=4 public | sort -hr
        
        echo ""
        echo "========================================================"
        echo "3. TOP 50 LARGEST FILES IN THE DEPLOYMENT"
        echo "========================================================"
        # Finds all files, prints their size, and sorts by largest
        find public -type f -exec du -h {} + | sort -hr | head -n 50
        
        echo ""
        echo "========================================================"
        echo "4. ASSET TYPE SUMMARY"
        echo "========================================================"
        echo "Images (WebP/JPG/PNG):"
        find public -regex '.*\.\(webp\|jpg\|jpeg\|png\|gif\)' -exec du -ch {} + | grep total || echo "None found"
        echo "Videos (MP4/WebM):"
        find public -regex '.*\.\(mp4\|webm\)' -exec du -ch {} + | grep total || echo "None found"
        echo "Scripts & Styles (JS/CSS):"
        find public -regex '.*\.\(js\|css\)' -exec du -ch {} + | grep total || echo "None found"

    # 8.6. Legacy Format Audit
    - name: Audit for Legacy JPG/JPEG Files in Public
      working-directory: blog
      run: |
        echo "========================================================"
        echo "AUDITING PUBLIC FOLDER FOR LEGACY JPG/JPEG FILES"
        echo "========================================================"
        echo "Expected: All images should be WebP. Checking for leftovers..."
        
        # Find all .jpg or .jpeg files (case-insensitive)
        LEFTOVERS=$(find public -type f -regex '.*\.\(jpg\|jpeg\|JPG\|JPEG\)')
        
        if [ -z "$LEFTOVERS" ]; then
          echo "Success: No JPG/JPEG files found in the public folder."
        else
          echo "!!! WARNING: Found legacy image formats in the deployment !!!"
          echo "These files should have been converted to WebP:"
          echo "--------------------------------------------------------"
          echo "$LEFTOVERS"
          echo "--------------------------------------------------------"
          
          # Count the files
          COUNT=$(echo "$LEFTOVERS" | wc -l)
          echo "Total legacy files found: $COUNT"
          
          echo ""
          echo "Tip: Check if these images are being copied as 'static' assets"
          echo "or if a Hugo template is missing the WebP processing filter."
        fi

    # 9. Final Deployment Size Report
    - name: Final Public Folder Size Summary
      working-directory: blog
      run: |
        echo "========================================================"
        echo "FINAL DEPLOYMENT SIZE REPORT"
        echo "========================================================"
        
        # 1. Total size of the public folder
        TOTAL_SIZE=$(du -sh public | cut -f1)
        echo "TOTAL DEPLOYABLE SIZE: $TOTAL_SIZE"
        
        echo ""
        echo "--- TOP 10 LARGEST DIRECTORIES ---"
        # Shows exactly which sections of your site are taking the most space
        du -h --max-depth=3 public | sort -hr | head -n 10
        
        echo ""
        echo "--- TOP 20 LARGEST INDIVIDUAL FILES ---"
        # Lists the specific files (likely high-res images) contributing to bloat
        find public -type f -exec du -h {} + | sort -hr | head -n 20
        
        echo ""
        # Alert if the size is approaching the 1GB limit
        SIZE_BYTES=$(du -sb public | cut -f1)
        LIMIT_BYTES=1073741824 # 1 GB in bytes
        if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
          echo "!!! WARNING: Deployment size exceeds 1 GB limit !!!"
        elif [ "$SIZE_BYTES" -gt 858993459 ]; then
          echo "!!! CAUTION: Deployment size is over 800 MB (Approaching limit) !!!"
        fi

    # 9. 5. GitHub Pages Deployment Phase & Deploy
    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'blog/public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    # 10. Extract URLs and Submit to IndexNow (Moved here after deployment)
    - name: Extract URLs and Submit to IndexNow
      working-directory: blog
      run: |
        echo "Waiting for GitHub Pages deployment to propagate..."
        # Wait 30 seconds to ensure the new deployment is live across edge nodes
        sleep 30 
        
        # Verify the key file is actually reachable before pinging IndexNow
        KEY_URL="https://tejasjog.github.io/blog/90713259142C4858C5DB91DF25E69DBF.txt"
        STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$KEY_URL")
        
        if [ "$STATUS" -ne 200 ]; then
          echo "Error: Key file is not live yet (Status: $STATUS). Aborting IndexNow ping."
          exit 0 # Exit gracefully so the workflow doesn't fail
        fi

        echo "Key is live. Extracting URLs from sitemap.xml..."
        URLS=$(grep -Po '(?<=<loc>)([^<]+)' public/sitemap.xml | sed 's/^/"/;s/$/"/' | paste -sd "," -)
        
        echo "Submitting batch request to IndexNow..."
        JSON_PAYLOAD='{
          "host": "https://tejasjog.github.io/blog",
          "key": "90713259142C4858C5DB91DF25E69DBF",
          "keyLocation": "https://tejasjog.github.io/blog/90713259142C4858C5DB91DF25E69DBF.txt",
          "urlList": ['"$URLS"']
        }'
        
        curl -X POST "https://api.indexnow.org/IndexNow" \
             -H "Content-Type: application/json; charset=utf-8" \
             -d "$JSON_PAYLOAD" -v
             
    # 11. CRITICAL SPACE CLEANUP
    - name: Cleanup GitHub Pages Build Assets
      working-directory: blog
      run: |
        echo "Cleaning up public directory to free space..."
        rm -rf public
        echo "Cleanup complete. Disk usage after cleanup:"
        df -h
