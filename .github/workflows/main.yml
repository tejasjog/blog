name: Deploy Single File from GitLab to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Checkout the specific GitLab repository
      # This clones tejasjog/blog directly into the runner's workspace
      - name: Checkout GitLab Repository
        uses: actions/checkout@v4
        with:
          repository: 'https://gitlab.com/tejasjog/blog.git'
          token: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          fetch-depth: 1

      # 2. Prepare the deployment folder
      - name: Prepare Files
        run: |
          mkdir -p staging
          
          # Based on your repo path: blog/github.io/index.html
          # Note: 'actions/checkout' usually places the repo contents at the root.
          # If the folder 'blog' is part of the repo structure:
          if [ -f "blog/github.io/index.html" ]; then
            cp blog/github.io/index.html staging/index.html
            echo "Successfully found file in blog/github.io/"
          
          # If 'github.io' is at the root of the repo:
          elif [ -f "github.io/index.html" ]; then
            cp github.io/index.html staging/index.html
            echo "Successfully found file in github.io/"
          
          else
            echo "ERROR: index.html not found in expected paths!"
            ls -R
            exit 1
          fi

      # 3. Upload to GitHub Pages
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging'

      # 4. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
