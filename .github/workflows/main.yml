name: Deploy to Cloudflare Pages from GitLab - Hugo blog 

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    env:
      DART_SASS_VERSION: 1.97.3
      HUGO_VERSION: 0.155.3
      NODE_VERSION: 20

    steps:
    # 0. EARLY SYSTEM CLEANUP & LOG CLEARING
    - name: Maximize Runner Space
      run: |
        echo "Clearing runner logs and large packages..."
        # Clear the specific directory that caused the previous crash
        sudo rm -rf /home/runner/actions-runner/_diag/* # Remove massive pre-installed tools
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        
        # Clean docker and apt
        sudo docker system prune --all --force
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h

    # 1. Checkout Code
    - name: Checkout Code from GitLab
      env:
        GIT_OAUTH_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      run: |
        git config --global url."https://oauth2:$GIT_OAUTH_TOKEN@gitlab.com".insteadOf "https://gitlab.com"
        git clone --recursive https://gitlab.com/tejasjog/blog.git
        cd blog

    # 2. Optimized Node.js Setup
    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # 3. Install Hugo & Sass (Binary-only to save space)
    - name: Install Dependencies
      run: |
        # Install Hugo Extended Binary
        curl -L -o hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.tar.gz
        tar -xzf hugo.tar.gz hugo
        sudo mv hugo /usr/local/bin/
        rm hugo.tar.gz

        # Install Dart Sass Binary
        curl -L -o sass.tar.gz https://github.com/sass/dart-sass/releases/download/${{ env.DART_SASS_VERSION }}/dart-sass-${{ env.DART_SASS_VERSION }}-linux-x64.tar.gz
        tar -xzf sass.tar.gz
        sudo cp dart-sass/sass /usr/local/bin/
        rm -rf sass.tar.gz dart-sass

    # 4. Install Node Dependencies (Netlify CLI removed)
    - name: Install Node Dependencies and Wrangler
      working-directory: blog
      run: |
        npm install --no-audit --no-fund
        npm install -g wrangler

    # 5. Modify Shortcode
    - name: Modify responsiveImage Shortcode
      working-directory: blog
      run: |
        SHORTCODE_PATH=$(find . -path "*/shortcodes/responsiveImage.html" -type f | head -n 1)
        if [ -n "$SHORTCODE_PATH" ]; then
          sed -i "s|slice 1600|${{ vars.CLOUDFLARE_IMAGE_WIDTHS }}|g" "$SHORTCODE_PATH"
        fi

    # 6. Build Hugo Site
    - name: Build Hugo Site
      working-directory: blog
      run: |
        hugo --gc --minify --baseURL ${{ vars.CI_CF_PAGES_URL || 'https://tejasjog-blog.pages.dev/' }} --destination public --environment production --logLevel debug
        df -h

    # 7. Deploy to Cloudflare
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: 'tejasjog-blog'
        directory: 'blog/public'
        branch: 'master'

    # 8. FINAL CLEANUP
    - name: Post-Build Cleanup
      if: always()
      run: |
        rm -rf blog/public
        df -h
