name: Deploy Single File from GitLab to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Clone the GitLab repository
      - name: Clone GitLab Repository
        env:
          GL_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        run: |
          git clone --depth 1 "https://oauth2:${GL_TOKEN}@gitlab.com/tejasjog/blog.git" gitlab-content

      # 2. Prepare, Substitute, and Stage Files
      - name: Prepare and Substitute Files
        run: |
          mkdir -p staging
          
          # Path to source file
          TARGET="gitlab-content/github.io/index.html"
          
          if [ -f "$TARGET" ]; then
            # Copy to staging first to avoid modifying the git source
            cp "$TARGET" staging/index.html
            
            # --- SUBSTITUTION STEP ---
            # We use '|' as a delimiter because the URL contains '/'
            OLD_URL="https://tejasjog.github.io/blog/"
            NEW_URL="${{ vars.CLOUDFLARE_BLOG_URL }}"
            
            echo "Substituting $OLD_URL with $NEW_URL"
            sed -i "s|$OLD_URL|$NEW_URL|g" staging/index.html
            
            echo "Successfully substituted and staged index.html"
          else
            echo "ERROR: File $TARGET not found!"
            exit 1
          fi

      # 3. Upload the 'staging' folder as the website content
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging'

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
